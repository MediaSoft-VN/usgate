# Host-level nginx reverse proxy for new-api
# Place this file at /etc/nginx/sites-available/new-api and symlink to sites-enabled/
# Or include in your nginx.conf
# Update server_name and SSL certificate paths for your domain

upstream new_api_backend {
    server 127.0.0.1:9991;  # new-api container mapped port (Docker host)
}

server {
    listen 80;
    server_name your-domain.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # SSL configuration - UPDATE THESE PATHS to your real cert files
    #ssl_certificate     /etc/ssl/certs/your-cert.pem;
    #ssl_certificate_key /etc/ssl/private/your-key.pem;
    #ssl_protocols       TLSv1.3 TLSv1.2;
    #ssl_ciphers         HIGH:!aNULL:!MD5;
    #ssl_prefer_server_ciphers off;
    #ssl_session_timeout 1d;
    #ssl_session_cache   shared:SSL:10m;
    #ssl_session_tickets off;

    # Proxy to new-api container on port 9991
    location / {
        proxy_pass http://new_api_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout  300s;
    }

    # Health check endpoint
    location /api/status {
        access_log off;
        proxy_pass http://new_api_backend;
    }
}