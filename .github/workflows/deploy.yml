name: Deploy native release

on:
  push:
    branches:
      - main
    paths:
      - deploy/new-api
      - .github/scripts/deploy-native.sh
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy prebuilt binary
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Validate prebuilt binary
        run: |
          set -euo pipefail
          test -f deploy/new-api
          test -x deploy/new-api || chmod +x deploy/new-api
          file deploy/new-api
          sha256sum deploy/new-api

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_SSH_PRIVATE_KEY}"
          test -n "${DEPLOY_KNOWN_HOSTS}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload prebuilt binary
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_PORT:?DEPLOY_PORT is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          scp -P "${DEPLOY_PORT}" \
            deploy/new-api \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/new-api-${GITHUB_SHA}"

      - name: Activate release and verify health
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          APP_USER: ${{ vars.APP_USER }}
          APP_DIR: ${{ vars.APP_DIR }}
          APP_PORT: ${{ vars.APP_PORT }}
          DOMAIN: ${{ vars.PROD_DOMAIN }}
          OLD_DOMAIN: ${{ vars.OLD_DOMAIN }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          NEW_API_ENV: ${{ secrets.NEW_API_ENV }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_PORT:?DEPLOY_PORT is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          : "${DOMAIN:?PROD_DOMAIN environment variable is required}"
          : "${CERTBOT_EMAIL:?CERTBOT_EMAIL is required}"
          : "${NEW_API_ENV:?NEW_API_ENV secret is required}"
          checksum="$(sha256sum deploy/new-api | cut -d' ' -f1)"
          {
            printf 'APP_USER=%q\n' "${APP_USER:-${DEPLOY_USER}}"
            printf 'APP_DIR=%q\n' "${APP_DIR:-/opt/new-api}"
            printf 'APP_PORT=%q\n' "${APP_PORT:-}"
            printf 'DOMAIN=%q\n' "${DOMAIN}"
            printf 'OLD_DOMAIN=%q\n' "${OLD_DOMAIN:-}"
            printf 'CERTBOT_EMAIL=%q\n' "${CERTBOT_EMAIL}"
            printf 'NEW_API_ENV=%q\n' "${NEW_API_ENV}"
            printf 'RELEASE_ID=%q\n' "${GITHUB_SHA}"
            printf 'EXPECTED_SHA256=%q\n' "${checksum}"
            printf 'SSH_USER=%q\n' "${DEPLOY_USER}"
            cat .github/scripts/deploy-native.sh
          } | ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s'
