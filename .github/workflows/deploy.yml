name: Deploy native release

on:
  push:
    branches:
      - main
    paths:
      - deploy/new-api.gz
      - .github/scripts/deploy-native.sh
      - scripts/install-tenant-domain-provisioner.sh
      - scripts/tenant-domain-host.sh
      - scripts/tenant-domain-socket.py
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy locally built New API
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Validate locally built release package
        run: |
          set -euo pipefail
          test -s deploy/new-api.gz
          gzip -t deploy/new-api.gz
          file deploy/new-api.gz
          sha256sum deploy/new-api.gz
          bash -n scripts/install-tenant-domain-provisioner.sh
          bash -n scripts/tenant-domain-host.sh
          python3 -c "compile(open('scripts/tenant-domain-socket.py', encoding='utf-8').read(), 'tenant-domain-socket.py', 'exec')"

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_SSH_PRIVATE_KEY}"
          test -n "${DEPLOY_KNOWN_HOSTS}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload release package
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_PORT:?DEPLOY_PORT is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          scp -P "${DEPLOY_PORT}" \
            deploy/new-api.gz \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/new-api-${GITHUB_SHA}.gz"

      - name: Upload tenant-domain host provisioner
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          provisioner_dir="/tmp/new-api-tenant-domain-${GITHUB_SHA}"
          ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "install -d -m 0700 '${provisioner_dir}'"
          scp -P "${DEPLOY_PORT}" \
            scripts/install-tenant-domain-provisioner.sh \
            scripts/tenant-domain-host.sh \
            scripts/tenant-domain-socket.py \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${provisioner_dir}/"

      - name: Activate release and verify health
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          APP_USER: ${{ vars.APP_USER }}
          APP_DIR: ${{ vars.APP_DIR }}
          APP_PORT: ${{ vars.APP_PORT }}
          DOMAIN: ${{ vars.PROD_DOMAIN || 'newapi.usgate.ai' }}
          OLD_DOMAIN: ${{ vars.OLD_DOMAIN }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          NEW_API_ENV: ${{ secrets.NEW_API_ENV }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_PORT:?DEPLOY_PORT is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          : "${DOMAIN:?Production domain is required}"
          : "${CERTBOT_EMAIL:?CERTBOT_EMAIL is required}"
          : "${NEW_API_ENV:?NEW_API_ENV secret is required}"
          checksum="$(sha256sum deploy/new-api.gz | cut -d' ' -f1)"
          tenant_installer_checksum="$(sha256sum scripts/install-tenant-domain-provisioner.sh | cut -d' ' -f1)"
          tenant_host_checksum="$(sha256sum scripts/tenant-domain-host.sh | cut -d' ' -f1)"
          tenant_socket_checksum="$(sha256sum scripts/tenant-domain-socket.py | cut -d' ' -f1)"
          {
            printf 'APP_USER=%q\n' "${APP_USER:-${DEPLOY_USER}}"
            printf 'APP_DIR=%q\n' "${APP_DIR:-/opt/new-api}"
            printf 'APP_PORT=%q\n' "${APP_PORT:-}"
            printf 'DOMAIN=%q\n' "${DOMAIN}"
            printf 'OLD_DOMAIN=%q\n' "${OLD_DOMAIN:-}"
            printf 'CERTBOT_EMAIL=%q\n' "${CERTBOT_EMAIL}"
            printf 'NEW_API_ENV=%q\n' "${NEW_API_ENV}"
            printf 'RELEASE_ID=%q\n' "${GITHUB_SHA}"
            printf 'EXPECTED_SHA256=%q\n' "${checksum}"
            printf 'SSH_USER=%q\n' "${DEPLOY_USER}"
            printf 'TENANT_DOMAIN_INSTALLER_SHA256=%q\n' "${tenant_installer_checksum}"
            printf 'TENANT_DOMAIN_HOST_SHA256=%q\n' "${tenant_host_checksum}"
            printf 'TENANT_DOMAIN_SOCKET_SHA256=%q\n' "${tenant_socket_checksum}"
            cat .github/scripts/deploy-native.sh
          } | ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s'
